name: Naver Dev News Auto Mailer

on:
  schedule:
    # 한국 시간 오전 6시는 세계 표준시(UTC)로 전날 밤 9시입니다.
    - cron: '0 21 * * *'
  
  # 내가 원할 때 버튼을 눌러서 바로 보낼 수 있게 해주는 기능입니다.
  workflow_dispatch:

jobs:
  run-mailer:
    runs-on: ubuntu-latest

    steps:
    # 1. 가상 컴퓨터에 내 소스코드 가져오기
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. 파이썬 배움터 설치하기
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 필요한 도구(라이브러리) 설치하기
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. 3단계에서 숨겨놓은 비밀번호들을 가져와서 메일 발송 프로그램 실행하기
    - name: Run Mailer Script
      env:
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      run: |
        python development_news_mailer.py
