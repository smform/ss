name: Naver Dev News Auto Mailer

on:
  schedule:
    # ⏰ 대한민국 시간(KST) 기준 하루 2번 정밀 자동 스케줄링 설정
    # 1) 0 21 * * * -> 세계 표준시(UTC) 21시 = 한국 시간 다음날 오전 6시 0분
    # 2) 0 5 * * * -> 세계 표준시(UTC) 05시 = 한국 시간 같은날 오후 2시 0분
    - cron: '0 21 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-mailer:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # Node.js 경고창 방지 설정

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Mailer Script
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python development_news_mailer.py
