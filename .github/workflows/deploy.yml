name: Naver Dev News Auto Mailer

on:
  schedule:
    # ⏰ 한국 시간 기준 하루 2번 자동 실행 설정
    # 1) 0 21 * * * -> 세계시 21시 0분 = 한국 시간 오전 6시 0분
    # 2) 0 5 * * * -> 세계시 05시 0분 = 한국 시간 오후 2시 0분
    - cron: '0 21 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch: # 언제든 수동으로 발송할 수 있는 버튼 활성화

jobs:
  run-mailer:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # 💡 Node.js deprecation 경고 끄기 설정

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Mailer Script
        env:
          # 깃허브 안전 금고(Secrets)에 저장해두신 기존 비밀번호 값들을 그대로 매핑합니다.
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python development_news_mailer.py
